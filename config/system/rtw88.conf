# Realtek rtw88 (RTL8821CE e parentes): Wi-Fi e Bluetooth no mesmo chip.
# Com a economia de energia profunda (LPS deep) e o ASPM ligados, o firmware
# trava ("failed to send h2c command", "firmware failed to leave lps state"),
# a coexistência Wi-Fi/Bluetooth para de funcionar e o áudio Bluetooth corta.
# Instalado pelo assistente-fedora (etapa bluetooth). Vale após reiniciar.
options rtw88_core disable_lps_deep=Y
options rtw88_pci disable_aspm=Y
