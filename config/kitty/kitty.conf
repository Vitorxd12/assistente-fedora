# Wayland nativo, sem barra de título: a extensão kitty-window-buttons@vitor.local
# desenha os botões e a faixa de arrasto no padding superior.
linux_display_server wayland
hide_window_decorations titlebar-only
shell /usr/bin/zsh

# --- fonte ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        12.0
disable_ligatures never

# --- janela ---
window_padding_width 24 10 10 10
background_opacity   1.0

# --- imagem de fundo ---
include wallpaper.conf
background_image_layout cscaled
background_tint         0.80
cursor_shape         beam
cursor_blink_interval 0.5
enable_audio_bell    no
confirm_os_window_close 0

# --- abas ---
tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   round
tab_title_template    "{index}: {title}"
active_tab_font_style   bold
inactive_tab_foreground #a9b1d6
inactive_tab_background #24283b
map f2 set_tab_title
map ctrl+shift+r set_tab_title
map ctrl+shift+alt+t set_tab_title

# --- cores (Tokyo Night + cor de destaque do sistema) ---
foreground #c0caf5
background #000000
url_color #73daca

color0  #15161e
color8  #414868
color1  #f7768e
color9  #f7768e
color2  #9ece6a
color10 #9ece6a
color3  #e0af68
color11 #e0af68
color4  #7aa2f7
color12 #7aa2f7
color5  #bb9af7
color13 #bb9af7
color6  #7dcfff
color14 #7dcfff
color7  #a9b1d6
color15 #c0caf5

# cor de destaque do GNOME (gerado por ~/.local/bin/accent-sync)
include accent.conf
